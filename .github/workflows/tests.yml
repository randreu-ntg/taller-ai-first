name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version-file: ".tool-versions"

      - name: Instalar dependencias (incluye grupo dev)
        run: uv sync --locked --all-groups

      - name: Correr tests
        run: uv run pytest
